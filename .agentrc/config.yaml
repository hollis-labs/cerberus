# Project agentrc config — cerberus
agentrc_version: 2.2.0

agents:
  cerberus-backend:
    name: Cerberus Backend Engineer
    description: Go service development for the Cerberus daemon and MCP server
    roles: [backend, go]
    skills: [go-build, go-lint, go-test]
    context: agents/backend.md

  cerberus-frontend:
    name: Cerberus TUI Developer
    description: Bubble Tea TUI development for the Cerberus terminal interface
    roles: [frontend, go]
    skills: [go-build, go-test]
    context: agents/frontend.md

  cerberus-reviewer:
    name: Cerberus Code Reviewer
    description: Code review for Cerberus PRs
    roles: [code-review, go]
    skills: [go-lint, go-test]

docs:
  architecture: docs/architecture-v2.md
