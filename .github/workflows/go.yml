name: Go
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
          cache: true
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - name: Race tests with private application roots
        run: |
          mkdir -p "$RUNNER_TEMP/cerberus-home" "$RUNNER_TEMP/cerberus-config" "$RUNNER_TEMP/cerberus-data" "$RUNNER_TEMP/cerberus-cache" "$RUNNER_TEMP/cerberus-state"
          HOME="$RUNNER_TEMP/cerberus-home" XDG_CONFIG_HOME="$RUNNER_TEMP/cerberus-config" XDG_DATA_HOME="$RUNNER_TEMP/cerberus-data" XDG_CACHE_HOME="$RUNNER_TEMP/cerberus-cache" XDG_STATE_HOME="$RUNNER_TEMP/cerberus-state" go test -race -count=1 -timeout=10m ./...
