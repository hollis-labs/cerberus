name: Go
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"
          cache: true
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - name: Portable SQL rules (libs core/store lint)
        run: go run github.com/hollis-labs/libs/core/store/cmd/gostore-lint ./...
      - name: Race tests with private application roots
        run: |
          mkdir -p "$RUNNER_TEMP/cerberus-home" "$RUNNER_TEMP/cerberus-config" "$RUNNER_TEMP/cerberus-data" "$RUNNER_TEMP/cerberus-cache" "$RUNNER_TEMP/cerberus-state"
          HOME="$RUNNER_TEMP/cerberus-home" XDG_CONFIG_HOME="$RUNNER_TEMP/cerberus-config" XDG_DATA_HOME="$RUNNER_TEMP/cerberus-data" XDG_CACHE_HOME="$RUNNER_TEMP/cerberus-cache" XDG_STATE_HOME="$RUNNER_TEMP/cerberus-state" go test -race -count=1 -timeout=10m ./...
      # Every test package runs under its own scratch home (internal/testhome).
      # This proves it: the whole suite runs with HOME a read-only empty
      # directory, so a test that reached the real home could not write it and
      # fails, and the directory must still be empty afterwards
      # (CW-20261114-0143).
      - name: The suite never writes HOME
        run: |
          ro="$RUNNER_TEMP/read-only-home"
          mkdir -p "$ro"
          export GOPATH="$(go env GOPATH)" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" GOTELEMETRY=off
          chmod 555 "$ro"
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME HOME="$ro" go test -count=1 -timeout=10m ./...
          if [ -n "$(find "$ro" -mindepth 1 -print -quit)" ]; then
            echo "the suite wrote under HOME:"; find "$ro" -mindepth 1; exit 1
          fi
  scheduler-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.11"
          cache: true
      - name: Scheduler acceptance with fake targets and private application roots
        run: |
          export TMPDIR="$RUNNER_TEMP/cerberus-scheduler-tmp"
          export HOME="$RUNNER_TEMP/cerberus-scheduler-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/cerberus-scheduler-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/cerberus-scheduler-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cerberus-scheduler-cache"
          export XDG_STATE_HOME="$RUNNER_TEMP/cerberus-scheduler-state"
          mkdir -p "$TMPDIR" "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          go test -race -count=1 -timeout=5m ./internal/scheduling ./internal/pipeline ./internal/pipeline/actions
          go test -race -count=1 -timeout=5m ./internal/cerbapi -run '^TestSchedule'
          go test -race -count=1 -timeout=5m ./cmd/cerberus -run '^TestSchedule'
          go test -race -count=1 -timeout=5m ./internal/mcp ./internal/webui
