# CI for the Substrate port (branch substrate-port). Shape follows hollis-labs/substrate
# docs/adopting-substrate.md section 9; main keeps its own workflows until cutover.
name: ci
on:
  push:
    branches: [substrate-port]
  pull_request:
    branches: [substrate-port]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOWORK: "off"
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
    # The store tests run on SQLite and on Postgres (plan section 5.1). A throwaway server per run,
    # as libs does, reachable only from the job; trust auth, so no credential exists anywhere.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cerberus
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cerberus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cerberus -d cerberus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan-public reads history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the console
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Dependencies
        run: go mod tidy -diff
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Portable SQL rules (libs core/store lint)
        run: go run github.com/hollis-labs/libs/core/store/cmd/gostore-lint ./...
      - name: Pins match the Substrate BOM
        run: go run github.com/hollis-labs/substrate/cmd/substrate pins check --app .
      # The gates below run even when an earlier gate fails, so one red check never hides another.
      - name: Race tests with private application roots
        if: ${{ !cancelled() }}
        run: |
          r="$RUNNER_TEMP/cerberus"
          mkdir -p "$r/home" "$r/config" "$r/data" "$r/cache" "$r/state" "$r/tmp"
          HOME="$r/home" XDG_CONFIG_HOME="$r/config" XDG_DATA_HOME="$r/data" XDG_CACHE_HOME="$r/cache" XDG_STATE_HOME="$r/state" TMPDIR="$r/tmp" \
          SUBSTRATE_TEST_POSTGRES_DSN="postgres://cerberus@127.0.0.1:5432/cerberus_test?sslmode=disable" \
            go test -race -count=1 -timeout=15m ./...
      # Every test package runs under its own scratch home (internal/testhome). This proves
      # it: the whole suite runs with HOME a read-only empty directory, and the directory must
      # still be empty afterwards (CW-20261114-0143).
      - name: The suite never writes HOME
        if: ${{ !cancelled() }}
        run: |
          ro="$RUNNER_TEMP/read-only-home"
          mkdir -p "$ro"
          export GOPATH="$(go env GOPATH)" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" GOTELEMETRY=off
          chmod 555 "$ro"
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME -u XDG_CACHE_HOME HOME="$ro" \
            SUBSTRATE_TEST_POSTGRES_DSN="postgres://cerberus@127.0.0.1:5432/cerberus_test?sslmode=disable" \
            go test -count=1 -timeout=10m ./...
          if [ -n "$(find "$ro" -mindepth 1 -print -quit)" ]; then
            echo "the suite wrote under HOME:"; find "$ro" -mindepth 1; exit 1
          fi
      # Code carried over from main is ported slice by slice; lint gates what each change adds,
      # against the merge base with substrate-port (from git, not the PR diff API, which refuses
      # diffs over 20,000 lines).
      - uses: golangci/golangci-lint-action@v7
        if: ${{ !cancelled() }}
        with:
          version: v2.11.4
          args: --new-from-merge-base=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      # The working tree is gated, with the legacy allowlist from main (#80); history goes to
      # the program-wide history pass (lead's call, CW-20261114-0119).
      - name: Public hygiene (tree)
        if: ${{ !cancelled() }}
        run: go run github.com/hollis-labs/substrate/cmd/substrate scan-public --tree
  scheduler-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Scheduler acceptance with fake targets and private application roots
        run: |
          r="$RUNNER_TEMP/cerberus-scheduler"
          export TMPDIR="$r/tmp" HOME="$r/home" XDG_CONFIG_HOME="$r/config" XDG_DATA_HOME="$r/data" XDG_CACHE_HOME="$r/cache" XDG_STATE_HOME="$r/state"
          mkdir -p "$TMPDIR" "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          go test -race -count=1 -timeout=5m ./internal/scheduling ./internal/pipeline ./internal/pipeline/actions
