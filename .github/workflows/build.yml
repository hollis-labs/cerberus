name: build
on:
  push: { branches: [main], paths-ignore: ["outpost/**", "fleet-install/**"] }
  pull_request: { branches: [main], paths-ignore: ["outpost/**", "fleet-install/**"] }
  workflow_dispatch:
    inputs: { ref: { description: "ref to build", required: false } }
permissions: { contents: read }
jobs:
  build:
    uses: hollis-labs/substrate/.github/workflows/go-app-build.yml@1ed895f38a725bdc928232721ac4642d744468ef   # tools main (extra_files, pre_test_cmd)
    with:
      app: cerberus
      main_pkg: ./cmd/cerberus
      targets: '["linux/amd64","darwin/arm64"]'
      # go.yml already runs the race tests and the scheduler-platform matrix; this job builds the artifact.
      test_cmd: "go build ./... && go vet ./cmd/... ./internal/... ./pkg/..."
      ldflags_var: main.version
      ldflags_extra: "-X main.commit=${{ github.sha }}"
      node_version: "22"
      ui_cmd: "cd web && npm ci && npm run build"
