schema_version: "1"
id: kubernetes
version: 0.2.0
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-kubernetes-plugin
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: kubernetes
        version: 0.2.0
        resource_types:
            - container
            - server
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: true
            can_health: true
        config:
            fields:
                - name: kubeconfig
                  type: string
                  description: Path to a kubeconfig file. Empty uses $KUBECONFIG, then ~/.kube/config.
                - name: context
                  type: string
                  description: Default kubeconfig context. Every operation can override it per call.
                - name: server
                  type: string
                  description: API server URL. Set this with the token secret to authenticate without a kubeconfig.
                - name: namespace
                  type: string
                  description: Namespace used when an operation names none. Empty uses the kubeconfig context's namespace, then default.
                - name: credential_path
                  type: string
                  description: Extra PATH-style directories searched for an exec credential plugin. The daemon runs under a minimal PATH that holds none of kubelogin, az or gcloud.
            secrets:
                - name: token
                  description: 'Bearer token for the API server, used with the server field. Optional: a kubeconfig-authenticated cluster needs none.'
                  env: CERBERUS_KUBE_TOKEN
        operations:
            - name: list_contexts
              description: List kubeconfig contexts with the authentication mode each one uses. Reads no cluster and needs no credential, so it works before anything else does.
              examples:
                - cerberus connectors exec kubernetes list_contexts
              input_schema:
                additionalProperties: false
                properties:
                    kubeconfig:
                        description: Kubeconfig path override.
                        type: string
                type: object
              effect: read
              target:
                kind: kubernetes.kubeconfig
                from:
                    - kubeconfig
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: check_access
              description: 'Report what would happen if a request were attempted: the auth mode, whether an exec credential plugin resolves from the daemon''s PATH, and whether it needs a terminal there is none of. Run this first when something is wrong.'
              examples:
                - cerberus connectors exec kubernetes check_access
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to check.
                        type: string
                    kubeconfig:
                        description: Kubeconfig path override.
                        type: string
                type: object
              effect: read
              target:
                kind: kubernetes.cluster
                from:
                    - context
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: get_health
              description: Report API server reachability and version. Names what actually failed — a refused dial on a VPN-only endpoint is the VPN, not the cluster.
              examples:
                - cerberus connectors exec kubernetes get_health
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                type: object
              effect: read
              target:
                kind: kubernetes.cluster
                from:
                    - context
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_namespaces
              description: List namespaces with status and age.
              examples:
                - cerberus connectors exec kubernetes list_namespaces
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    continue:
                        description: Continuation token from a previous truncated result.
                        type: string
                    limit:
                        description: Maximum items to return. Defaults to 100, capped at 1000. The result reports truncated when more exist.
                        type: integer
                type: object
              effect: read
              target:
                kind: kubernetes.cluster
                from:
                    - context
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_nodes
              description: List nodes with readiness, roles, version and any memory/disk/PID pressure.
              examples:
                - cerberus connectors exec kubernetes list_nodes
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    continue:
                        description: Continuation token from a previous truncated result.
                        type: string
                    limit:
                        description: Maximum items to return. Defaults to 100, capped at 1000. The result reports truncated when more exist.
                        type: integer
                type: object
              effect: read
              target:
                kind: kubernetes.cluster
                from:
                    - context
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_pods
              description: List pods in a namespace with phase, readiness, restarts and per-container state. Environment variable names are reported; values never are.
              examples:
                - cerberus connectors exec kubernetes list_pods --arg namespace=default
              input_schema:
                additionalProperties: false
                properties:
                    all_namespaces:
                        description: Read across every namespace instead. Deliberate rather than implied by an empty namespace.
                        type: boolean
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    continue:
                        description: Continuation token from a previous truncated result.
                        type: string
                    limit:
                        description: Maximum items to return. Defaults to 100, capped at 1000. The result reports truncated when more exist.
                        type: integer
                    namespace:
                        description: Namespace to read. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                    selector:
                        description: Label selector, e.g. app=web.
                        type: string
                type: object
              effect: read
              target:
                kind: kubernetes.namespace
                from:
                    - context
                    - namespace
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_workloads
              description: List deployments, statefulsets and daemonsets in a namespace with desired/ready replica counts and rollout condition.
              examples:
                - cerberus connectors exec kubernetes list_workloads --arg namespace=default
              input_schema:
                additionalProperties: false
                properties:
                    all_namespaces:
                        description: Read across every namespace instead. Deliberate rather than implied by an empty namespace.
                        type: boolean
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    continue:
                        description: Continuation token from a previous truncated result.
                        type: string
                    kind:
                        description: Restrict to one of deployment, statefulset, daemonset.
                        type: string
                    limit:
                        description: Maximum items to return. Defaults to 100, capped at 1000. The result reports truncated when more exist.
                        type: integer
                    namespace:
                        description: Namespace to read. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                type: object
              effect: read
              target:
                kind: kubernetes.namespace
                from:
                    - context
                    - namespace
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_events
              description: List recent cluster events, newest last. Usually the fastest answer to why something is not starting.
              examples:
                - cerberus connectors exec kubernetes list_events --arg namespace=default
              input_schema:
                additionalProperties: false
                properties:
                    all_namespaces:
                        description: Read across every namespace instead. Deliberate rather than implied by an empty namespace.
                        type: boolean
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    continue:
                        description: Continuation token from a previous truncated result.
                        type: string
                    limit:
                        description: Maximum items to return. Defaults to 50, capped at 1000. The result reports truncated when more exist.
                        type: integer
                    namespace:
                        description: Namespace to read. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                type: object
              effect: read_sensitive
              target:
                kind: kubernetes.namespace
                from:
                    - context
                    - namespace
              preview: none
              output: free_text
              cost: none
              local_fs: none
            - name: get_logs
              description: Read a bounded snapshot of a container's logs. Not a stream. Note that applications routinely log their own configuration at startup, so treat the output as sensitive.
              examples:
                - cerberus connectors exec kubernetes get_logs --arg pod=web-abc123
              input_schema:
                additionalProperties: false
                properties:
                    container:
                        description: Container name. Empty uses the first container.
                        type: string
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    namespace:
                        description: Namespace. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                    pod:
                        description: Pod name.
                        type: string
                    previous:
                        description: Read the previous terminated container instead.
                        type: boolean
                    tail:
                        description: Lines from the end of the log. Defaults to 200, capped at 5000.
                        type: integer
                required:
                    - pod
                type: object
              effect: read_sensitive
              target:
                kind: kubernetes.pod
                from:
                    - context
                    - namespace
                    - pod
              preview: none
              output: free_text
              cost: none
              local_fs: none
            - name: describe_workload
              description: 'Describe one deployment, statefulset or daemonset: replica counts, conditions, rollout strategy, container images, ports, resource requests and limits, which probes are set, mounted volume names, the pods it currently owns and the events recorded against it. Environment variable names are reported; values never are.'
              examples:
                - cerberus connectors exec kubernetes describe_workload --arg kind=deployment --arg name=web
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    kind:
                        description: One of deployment, statefulset, daemonset.
                        type: string
                    name:
                        description: Workload name.
                        type: string
                    namespace:
                        description: Namespace. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                required:
                    - kind
                    - name
                type: object
              effect: read
              target:
                kind: kubernetes.workload
                from:
                    - context
                    - namespace
                    - kind
                    - name
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_services
              description: List services with type, cluster IP, external addresses, ports and selector.
              examples:
                - cerberus connectors exec kubernetes list_services --arg namespace=default
              input_schema:
                additionalProperties: false
                properties:
                    all_namespaces:
                        description: Read across every namespace instead. Deliberate rather than implied by an empty namespace.
                        type: boolean
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    continue:
                        description: Continuation token from a previous truncated result.
                        type: string
                    limit:
                        description: Maximum items to return. Defaults to 100, capped at 1000. The result reports truncated when more exist.
                        type: integer
                    namespace:
                        description: Namespace to read. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                    selector:
                        description: Label selector, e.g. app=web.
                        type: string
                type: object
              effect: read
              target:
                kind: kubernetes.namespace
                from:
                    - context
                    - namespace
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_ingresses
              description: List ingresses with class, host and path routes to their backend services, and the name of each TLS secret. Secret contents are never read.
              examples:
                - cerberus connectors exec kubernetes list_ingresses --arg all_namespaces=true
              input_schema:
                additionalProperties: false
                properties:
                    all_namespaces:
                        description: Read across every namespace instead. Deliberate rather than implied by an empty namespace.
                        type: boolean
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    continue:
                        description: Continuation token from a previous truncated result.
                        type: string
                    limit:
                        description: Maximum items to return. Defaults to 100, capped at 1000. The result reports truncated when more exist.
                        type: integer
                    namespace:
                        description: Namespace to read. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                    selector:
                        description: Label selector, e.g. app=web.
                        type: string
                type: object
              effect: read
              target:
                kind: kubernetes.namespace
                from:
                    - context
                    - namespace
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_api_resources
              description: List the resource types the API server serves, including custom resources, with their group, version, scope and verbs. Reports any API group that failed discovery by name rather than returning a silently partial list.
              examples:
                - cerberus connectors exec kubernetes list_api_resources --arg group=apps
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    group:
                        description: Restrict to one API group, e.g. apps or cert-manager.io. Use core for the unnamed core group.
                        type: string
                    limit:
                        description: Maximum items to return. Defaults to 200, capped at 1000.
                        type: integer
                type: object
              effect: read
              target:
                kind: kubernetes.cluster
                from:
                    - context
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: top
              description: 'Report current CPU and memory for nodes or pods, highest CPU first. Needs metrics-server; when the cluster has none, reports available: false with the reason rather than failing.'
              examples:
                - cerberus connectors exec kubernetes top --arg kind=pods --arg namespace=default
              input_schema:
                additionalProperties: false
                properties:
                    all_namespaces:
                        description: Read across every namespace instead. Deliberate rather than implied by an empty namespace.
                        type: boolean
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    continue:
                        description: Continuation token from a previous truncated result.
                        type: string
                    kind:
                        description: nodes (default) or pods.
                        type: string
                    limit:
                        description: Maximum items to return. Defaults to 100, capped at 1000. The result reports truncated when more exist.
                        type: integer
                    namespace:
                        description: Namespace to read. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                    selector:
                        description: Label selector, e.g. app=web.
                        type: string
                type: object
              effect: read
              target:
                kind: kubernetes.namespace
                from:
                    - context
                    - namespace
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: scale_workload
              description: Set the replica count of a deployment or statefulset through its scale subresource. Requires --ack. --dry-run sends the change with dryRun=All, so the API server validates it, including RBAC, without applying it.
              examples:
                - cerberus connectors exec kubernetes scale_workload --arg kind=deployment --arg name=web --arg replicas=3 --dry-run --ack
                - cerberus connectors exec kubernetes scale_workload --arg kind=deployment --arg name=web --arg replicas=3 --ack
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    kind:
                        description: deployment or statefulset.
                        type: string
                    name:
                        description: Workload name.
                        type: string
                    namespace:
                        description: Namespace. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                    replicas:
                        description: Desired replica count, zero or more.
                        type: integer
                required:
                    - kind
                    - name
                    - replicas
                type: object
              effect: lifecycle
              reversible: true
              target:
                kind: kubernetes.workload
                from:
                    - context
                    - namespace
                    - kind
                    - name
              preview: server
              output: structured
              cost: none
              local_fs: none
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: restart_workload
              description: Rolling-restart a deployment, statefulset or daemonset the way kubectl rollout restart does, by stamping the pod template; the controller replaces pods at the pace its strategy allows. Requires --ack. Supports --dry-run.
              examples:
                - cerberus connectors exec kubernetes restart_workload --arg kind=deployment --arg name=web --ack
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    kind:
                        description: One of deployment, statefulset, daemonset.
                        type: string
                    name:
                        description: Workload name.
                        type: string
                    namespace:
                        description: Namespace. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                required:
                    - kind
                    - name
                type: object
              effect: lifecycle
              reversible: true
              target:
                kind: kubernetes.workload
                from:
                    - context
                    - namespace
                    - kind
                    - name
              preview: server
              output: structured
              cost: none
              local_fs: none
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: cordon_node
              description: Mark a node unschedulable so no new pods land on it. Pods already there keep running; this is not a drain. Requires --ack. Supports --dry-run.
              examples:
                - cerberus connectors exec kubernetes cordon_node --arg node=worker-1 --ack
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    node:
                        description: Node name.
                        type: string
                required:
                    - node
                type: object
              effect: lifecycle
              reversible: true
              target:
                kind: kubernetes.node
                from:
                    - context
                    - node
              preview: server
              output: structured
              cost: none
              local_fs: none
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: uncordon_node
              description: Mark a node schedulable again. Requires --ack. Supports --dry-run.
              examples:
                - cerberus connectors exec kubernetes uncordon_node --arg node=worker-1 --ack
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    node:
                        description: Node name.
                        type: string
                required:
                    - node
                type: object
              effect: lifecycle
              reversible: true
              target:
                kind: kubernetes.node
                from:
                    - context
                    - node
              preview: server
              output: structured
              cost: none
              local_fs: none
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: delete_pod
              description: Delete one pod. Reports whether a controller owns it and will replace it, or whether the delete is permanent. Requires --ack. Supports --dry-run.
              examples:
                - cerberus connectors exec kubernetes delete_pod --arg pod=web-abc123 --dry-run --ack
              input_schema:
                additionalProperties: false
                properties:
                    context:
                        description: Kubeconfig context to use.
                        type: string
                    grace_period_seconds:
                        description: Override the pod's termination grace period. Zero skips graceful shutdown.
                        type: integer
                    namespace:
                        description: Namespace. Empty uses the configured namespace, then the kubeconfig context's, then default.
                        type: string
                    pod:
                        description: Pod name.
                        type: string
                required:
                    - pod
                type: object
              effect: destructive
              target:
                kind: kubernetes.pod
                from:
                    - context
                    - namespace
                    - pod
              preview: server
              output: structured
              cost: none
              local_fs: none
              destructive: true
              supports_dry: true
              requires_ack: true
