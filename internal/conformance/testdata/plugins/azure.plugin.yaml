schema_version: "1"
id: azure
version: 0.1.0
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-azure-plugin
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: azure
        version: 0.1.0
        resource_types:
            - server
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: false
            can_health: true
        config:
            fields:
                - name: subscription_id
                  type: string
                  description: Default Azure subscription id. Omit when the account can see exactly one subscription; required when it can see several.
                - name: tenant_id
                  type: string
                  description: Entra tenant id for service principal auth. Omit to authenticate as the signed-in Azure CLI user.
                - name: client_id
                  type: string
                  description: Application (client) id for service principal auth. Omit to authenticate as the signed-in Azure CLI user.
            secrets:
                - name: client_secret
                  description: 'Service principal client secret. Optional: with no service principal configured the plugin authenticates as the signed-in Azure CLI user, which needs no stored credential.'
                  env: AZURE_CLIENT_SECRET
        operations:
            - name: list_subscriptions
              description: 'List the subscriptions this credential can see: id, display name, state, tenant.'
              examples:
                - cerberus connectors plugin managed exec azure list_subscriptions
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: read
              target:
                kind: azure.tenant
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: get_subscription
              description: Report one subscription. With no argument it resolves the one operations act on by default, which is the fastest way to confirm which estate Cerberus is reading.
              examples:
                - cerberus connectors plugin managed exec azure get_subscription
              input_schema:
                additionalProperties: false
                properties:
                    subscription_id:
                        description: Subscription id. Defaults to the configured subscription, or the only visible one.
                        type: string
                type: object
              effect: read
              target:
                kind: azure.subscription
                from:
                    - subscription_id
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_resource_groups
              description: 'List resource groups in a subscription: name, location, provisioning state.'
              examples:
                - cerberus connectors plugin managed exec azure list_resource_groups
              input_schema:
                additionalProperties: false
                properties:
                    subscription_id:
                        description: Subscription id. Defaults to the configured subscription, or the only visible one.
                        type: string
                type: object
              effect: read
              target:
                kind: azure.subscription
                from:
                    - subscription_id
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_resources
              description: 'List the whole resource inventory of a subscription: type, name, resource group, location. Provider-specific properties are deliberately not returned — that field is an untyped blob.'
              examples:
                - cerberus connectors plugin managed exec azure list_resources
              input_schema:
                additionalProperties: false
                properties:
                    subscription_id:
                        description: Subscription id. Defaults to the configured subscription, or the only visible one.
                        type: string
                type: object
              effect: read
              target:
                kind: azure.subscription
                from:
                    - subscription_id
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_ai_accounts
              description: 'List Cognitive Services / AI Services accounts: name, kind, sku, endpoint. Keys are never returned; local_auth_disabled reports whether key auth is even enabled.'
              examples:
                - cerberus connectors plugin managed exec azure list_ai_accounts
              input_schema:
                additionalProperties: false
                properties:
                    subscription_id:
                        description: Subscription id. Defaults to the configured subscription, or the only visible one.
                        type: string
                type: object
              effect: read
              target:
                kind: azure.subscription
                from:
                    - subscription_id
              preview: none
              output: structured
              cost: none
              local_fs: none
            - name: list_model_deployments
              description: 'List model deployments: deployment name, model, version, sku, capacity. Answers "what models can we actually call, at what version" without opening the portal. With no account it walks every AI account in the subscription.'
              examples:
                - cerberus connectors plugin managed exec azure list_model_deployments
                - cerberus connectors plugin managed exec azure list_model_deployments --arg account=PCB-Drawings-Extraction
              input_schema:
                additionalProperties: false
                properties:
                    account:
                        description: Cognitive Services account name. Omit to walk every AI account in the subscription.
                        type: string
                    resource_group:
                        description: Resource group holding the account. Looked up from the account name when omitted.
                        type: string
                    subscription_id:
                        description: Subscription id. Defaults to the configured subscription, or the only visible one.
                        type: string
                type: object
              effect: read
              target:
                kind: azure.ai_account
                from:
                    - subscription_id
                    - resource_group
                    - account
              preview: none
              output: structured
              cost: none
              local_fs: none
