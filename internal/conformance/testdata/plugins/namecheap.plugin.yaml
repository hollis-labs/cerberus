schema_version: "1"
id: namecheap
version: 0.2.1
protocol: plugin-sdk/subprocess
runtime: subprocess
entrypoint:
    command: bin/cerberus-namecheap-plugin
cerberus:
    connector:
        api_version: cerberus.connector/v1
        kind: Connector
        id: namecheap
        version: 0.2.1
        resource_types:
            - domain
        capabilities:
            can_create: false
            can_destroy: false
            can_build: false
            can_logs: false
            can_health: true
        config:
            fields:
                - name: domain
                  type: string
                  description: Domain name in sld.tld form.
                - name: sandbox
                  type: boolean
                  description: Use the Namecheap sandbox API (api.sandbox.namecheap.com) instead of production. The sandbox needs its own account and key.
            secrets:
                - name: api_user
                  description: Namecheap API user.
                  env: CERBERUS_NAMECHEAP_API_USER
                  required: true
                  kind: name
                - name: api_key
                  description: 'Namecheap API key. Namecheap has no read-only scope: a key can change every domain in the account.'
                  env: CERBERUS_NAMECHEAP_API_KEY
                  required: true
                - name: username
                  description: Namecheap username.
                  env: CERBERUS_NAMECHEAP_USERNAME
                  required: true
                  kind: name
                - name: client_ip
                  description: The public address Namecheap's API allow-list contains for this account. Without it the plugin sends 127.0.0.1.
                  env: CERBERUS_NAMECHEAP_CLIENT_IP
                  kind: name
        operations:
            - name: get_dns_record_set
              description: Read visible host records and domain email_type. getHosts may omit records; this is not an authoritative zone backup.
              examples:
                - cerberus connectors exec namecheap get_dns_record_set --arg domain=example.com
              input_schema:
                additionalProperties: false
                properties:
                    domain:
                        description: Domain name.
                        type: string
                required:
                    - domain
                type: object
              effect: read
              target:
                kind: namecheap.domain
                from:
                    - domain
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    records:
                        items:
                            properties:
                                value:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        type: array
                type: object
            - name: set_dns_record_set
              description: Replace ALL DNS hosts and explicitly set domain email routing. Supply an authoritative complete records array, including records getHosts hides. Omitted records are deleted. The --dry-run preview reads the current records from Namecheap (a network read, so it needs credentials) and lists what would be added, removed and kept.
              examples:
                - cerberus connectors exec namecheap set_dns_record_set --arg domain=example.com --arg email_type=MX --arg-json records='[{"type":"A","host":"@","value":"203.0.113.10","ttl":300}]' --dry-run --ack
                - cerberus connectors exec namecheap set_dns_record_set --input records.json --ack
              input_schema:
                additionalProperties: false
                properties:
                    domain:
                        description: Domain name.
                        type: string
                    email_type:
                        enum:
                            - MX
                            - MXE
                            - FWD
                            - OX
                            - NONE
                        type: string
                    records:
                        items:
                            additionalProperties: false
                            properties:
                                host:
                                    description: Host name.
                                    type: string
                                mx_pref:
                                    description: MX preference.
                                    type: integer
                                ttl:
                                    description: TTL.
                                    type: integer
                                type:
                                    description: DNS type.
                                    type: string
                                value:
                                    description: Record value.
                                    type: string
                            required:
                                - type
                                - host
                                - value
                            type: object
                        type: array
                required:
                    - domain
                    - email_type
                    - records
                type: object
              effect: destructive
              target:
                kind: namecheap.domain
                from:
                    - domain
              preview: plugin
              output: structured
              cost: none
              local_fs: none
              output_schema:
                properties:
                    records:
                        items:
                            properties:
                                value:
                                    type: string
                                    x-cerberus-label:
                                        - untrusted
                            type: object
                        type: array
                type: object
              destructive: true
              supports_dry: true
              requires_ack: true
            - name: list_domains
              description: List domains in the Namecheap account.
              examples:
                - cerberus connectors exec namecheap list_domains
              input_schema:
                additionalProperties: false
                properties: {}
                type: object
              effect: read
              target:
                kind: namecheap.account
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: array
            - name: get_domain_status
              description: Read detailed status for a Namecheap domain.
              examples:
                - cerberus connectors exec namecheap get_domain_status --arg domain=example.com
              input_schema:
                additionalProperties: false
                properties:
                    domain:
                        description: Domain name in sld.tld form.
                        type: string
                required:
                    - domain
                type: object
              effect: read
              target:
                kind: namecheap.domain
                from:
                    - domain
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: object
            - name: list_dns_records
              description: List DNS records for a Namecheap domain.
              examples:
                - cerberus connectors exec namecheap list_dns_records --arg domain=example.com
              input_schema:
                additionalProperties: false
                properties:
                    domain:
                        description: Domain name in sld.tld form.
                        type: string
                required:
                    - domain
                type: object
              effect: read
              target:
                kind: namecheap.domain
                from:
                    - domain
              preview: none
              output: structured
              cost: none
              local_fs: none
              output_schema:
                items:
                    properties:
                        value:
                            type: string
                            x-cerberus-label:
                                - untrusted
                    type: object
                type: array
            - name: set_custom_nameservers
              description: Switch a Namecheap domain to a custom nameserver set.
              examples:
                - cerberus connectors exec namecheap set_custom_nameservers --arg domain=example.com --arg nameservers=ns1.example.net --arg nameservers=ns2.example.net --dry-run --ack
                - cerberus connectors exec namecheap set_custom_nameservers --arg domain=example.com --arg nameservers=ns1.example.net --arg nameservers=ns2.example.net --ack
              input_schema:
                additionalProperties: false
                properties:
                    domain:
                        description: Domain name in sld.tld form.
                        type: string
                    nameservers:
                        description: List of nameservers to assign to the domain.
                        items:
                            type: string
                        minItems: 2
                        type: array
                required:
                    - domain
                    - nameservers
                type: object
              effect: write
              reversible: true
              target:
                kind: namecheap.domain
                from:
                    - domain
              preview: plugin
              output: structured
              cost: none
              local_fs: none
              output_schema:
                type: object
              destructive: true
              supports_dry: true
              requires_ack: true
    host:
        min_contract: 1
        max_contract: 1
    suggested_policy:
        - operation: set_custom_nameservers
          require: approval
          reason: moves the domain's DNS to other nameservers
        - operation: set_dns_record_set
          require: approval
          reason: replaces every host record of the domain; records left out are deleted
    surfaces:
        mcp:
            - get_dns_record_set
            - list_domains
            - get_domain_status
            - list_dns_records
        cli_only:
            - set_dns_record_set
    telemetry:
        - operation: set_dns_record_set
          events:
            - change
            - preview
        - operation: set_custom_nameservers
          events:
            - change
            - preview
